<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Message sent</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: system-ui, sans-serif;
			color: #202b38;
			background: #f3f6fa;
		}
		header {
			background: #fff;
			border-bottom: 1px solid #e1e7ef;
		}
		.header-inner {
			max-width: 960px;
			margin: auto;
			padding: 18px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
		}
		.brand { font-size: 1.2rem; font-weight: 700; }
		nav ul {
			display: flex;
			gap: 22px;
			margin: 0;
			padding: 0;
			list-style: none;
		}
		nav a { color: #405268; text-decoration: none; }
		nav a:hover, nav a:focus { color: #1769d2; }
		main { max-width: 680px; margin: 56px auto; padding: 0 24px; }
		.card {
			padding: 48px 32px;
			background: #fff;
			border: 1px solid #e1e7ef;
			border-radius: 12px;
			box-shadow: 0 8px 24px #24364b0d;
			text-align: center;
		}
		h1 { margin: 0; font-size: 3rem; }
		@media (max-width: 520px) {
			.header-inner { align-items: flex-start; flex-direction: column; }
			nav ul { flex-wrap: wrap; gap: 12px 18px; }
			main { margin: 32px auto; }
			.card { padding: 36px 24px; }
			h1 { font-size: 2.4rem; }
		}
	</style>
</head>
<body>
	<header>
		<div class="header-inner">
			<a class="brand" href="index.html#home" style="color: inherit; text-decoration: none;">Playwright Playground</a>
			<nav aria-label="Main menu">
				<ul>
					<li><a href="index.html#home">Home</a></li>
					<li><a href="index.html#about">About</a></li>
					<li><a href="index.html#contact">Contact</a></li>
				</ul>
			</nav>
		</div>
	</header>
	<main>
		<section class="card" aria-labelledby="page-title">
			<h1 id="page-title">Message sent</h1>
		</section>
	</main>
</body>
</html>
